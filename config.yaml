# Weather Prediction Market Edge Finder - Configuration
# =====================================================

# General settings
general:
  data_dir: "data"
  cache_dir: "data/cache"
  log_dir: "logs"
  log_level: "INFO"
  timezone: "US/Eastern"

# Data collection settings
data_collection:
  # NOAA / Open-Meteo historical data
  historical:
    years_back: 30
    open_meteo_base_url: "https://archive-api.open-meteo.com/v1/archive"
    noaa_cdo_base_url: "https://www.ncdc.noaa.gov/cdo-web/api/v2"
    noaa_cdo_token: "${NOAA_CDO_TOKEN}"  # Set via environment variable
    hurdat2_url: "https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2024-040824.txt"
    variables:
      - temperature_2m_max
      - temperature_2m_min
      - precipitation_sum
      - snowfall_sum
      - windspeed_10m_max
      - relative_humidity_2m_mean

  # NWS / GFS / CPC forecasts
  forecasts:
    nws_api_base: "https://api.weather.gov"
    nws_user_agent: "WeatherEdge/1.0 (weather-edge@example.com)"
    gfs_nomads_base: "https://nomads.ncep.noaa.gov/dods/gfs_0p25"
    cpc_outlook_url: "https://www.cpc.ncep.noaa.gov/products/predictions"
    enso_status_url: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"

  # Prediction market sources
  markets:
    polymarket:
      api_base: "https://clob.polymarket.com"
      gamma_api: "https://gamma-api.polymarket.com"
    kalshi:
      api_base: "https://api.elections.kalshi.com/trade-api/v2"
      # Kalshi requires auth for some endpoints
      api_key: "${KALSHI_API_KEY}"
      api_secret: "${KALSHI_API_SECRET}"

  # Update frequency (in hours)
  update_interval_hours: 6

