# Probability engine settings
probability:
  monte_carlo_simulations: 10000
  bootstrap_samples: 5000
  confidence_interval: 0.90
  # Distribution fitting
  temperature_distribution: "normal"  # normal, skewnorm, gev
  precipitation_distribution: "gamma"
  snowfall_distribution: "zero_inflated_gamma"
  # Forecast bias correction
  forecast_bias_window_days: 30
  # Analog year matching
  analog_top_n: 10
  analog_enso_weight: 0.4
  analog_sst_weight: 0.3
  analog_pattern_weight: 0.3

# Edge detection settings
edge:
  # Minimum edge (model prob - market prob) to flag as opportunity
  min_edge_threshold: 0.05
  # Kelly criterion
  kelly_fraction: 0.5  # Half-Kelly (conservative default)
  max_position_pct: 0.10  # Max 10% of bankroll on single bet
  # Bankroll
  initial_bankroll: 1000.0
  # Market efficiency tiers (for prioritizing scans)
  efficiency_tiers:
    least_efficient:
      - "seasonal_temperature"
      - "hurricane_season"
      - "seasonal_snowfall"
    moderately_efficient:
      - "weekly_temperature"
      - "monthly_precipitation"
    most_efficient:
      - "next_day_temperature"
      - "tropical_storm_track"

# Alert settings
alerts:
  enabled: true
  # Channels (configure at least one)
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender: "${ALERT_EMAIL_SENDER}"
    password: "${ALERT_EMAIL_PASSWORD}"
    recipients:
      - "${ALERT_EMAIL_RECIPIENT}"
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
  discord:
    enabled: false
    webhook_url: "${DISCORD_WEBHOOK_URL}"
  # Alert thresholds
  new_opportunity_min_edge: 0.08
  edge_widening_delta: 0.05

# Dashboard settings
dashboard:
  host: "0.0.0.0"
  port: 5000
  refresh_interval_seconds: 300

# Cron schedule (crontab syntax)
cron:
  # Run full update every 6 hours
  full_update: "0 */6 * * *"
  # Run market scan every hour
  market_scan: "0 * * * *"
  # Run daily calibration check at midnight
  calibration_check: "0 0 * * *"
